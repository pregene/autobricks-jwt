[package]
name = "autobricks-jwt"
version = "0.1.28"
edition = "2024"
license-file = "LICENSE"
description = "Opaque encrypted JWT service for the Autobricks family"
repository = "https://github.com/pregene/autobricks-jwt"
build = "build.rs"

[lib]
name = "autobricks_jwt"
path = "src/lib.rs"

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
libloading = "0.8.9"
openssl = "0.10.81"
postgres = "0.19.14"
mysql = "28.0.3"
libc = "0.2.180"
ring = "0.17.14"
rusqlite = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
rustls = "0.23.35"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[[bin]]
name = "ab-jwtd"
path = "src/bin/ab-jwtd.rs"

[[bin]]
name = "ab-jwt-cli"
path = "src/bin/ab-jwt-cli.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true
